# Usage:
# python3.10 base_flower.py fit -c base.yaml

seed_everything: 42

trainer:
  max_epochs: 40
  max_steps: -1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  deterministic: true
  log_every_n_steps: 10
  enable_model_summary: false
  enable_checkpointing: true

  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: pruning
      tracking_uri: sqlite:///mlflow.db
      run_name: "base"        

  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: ./logs/checkpoints
        monitor: val_acc
        filename: checkpoint_base_{epoch:02d}_{val_acc:.4f}
        save_top_k: 1
        mode: max
        save_last: false

    - class_path: base_flower.ProgressiveBackboneFinetuning
      init_args:
        unfreeze_at_epoch_1: 10
        unfreeze_at_epoch_2: 20

    - class_path: base_flower.PostFreezeModelSummary
      init_args: {}

  profiler:
    class_path: lightning.pytorch.profilers.SimpleProfiler
    init_args:
      dirpath: ./profiler_output
      filename: prof_logs_base
      extended: true

data:
  bs: 128
  nw: 2
  pf: 2
  data_path: ./99_flower_data
  splitid: ./99_flower_data/setid.mat

model:
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-2
      weight_decay: 1e-4
  scheduler:
    class_path: torch.optim.lr_scheduler.StepLR
    init_args:
      step_size: 10
      gamma: 0.2
